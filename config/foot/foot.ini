# based on /etc/xdg/foot/foot.ini

shell=/usr/bin/fish
font=monospace:size=18

[key-bindings]
# defaults conflict with emacs undo shortcut, so we change them:
font-increase=Control+bracketright
font-decrease=Control+bracketleft
show-urls-launch=Mod4+u

# other useful shortcuts, for reference:
# Control+Shift+R starts scrollback search
# and then, Control+R and Control+S search forwards and backwards
